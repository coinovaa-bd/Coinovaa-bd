name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Fix project structure
        run: |
          if [ -f main.dart ]; then mkdir -p lib; mv main.dart lib/main.dart; fi
          flutter create --org com.coinovaa.bd --project-name coinovaa_bd --platforms android .
          flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Coinovaa-APK
          path: build/app/outputs/flutter-apk/app-release.apk
