name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
      - name: Fix project structure
        run: |
          if [ -f main.dart ]; then mkdir -p lib && mv main.dart lib/main.dart; fi
          cp lib/main.dart /tmp/main.dart.bak || echo "no main"
          cp pubspec.yaml /tmp/pubspec.bak || echo "no pubspec"
          rm -rf android
          flutter create --org com.coinovaa.app --project-name coinovaa_bd . --overwrite
          cp /tmp/main.dart.bak lib/main.dart || true
          cp /tmp/pubspec.bak pubspec.yaml || true
          flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Coinovaa-APK
          path: build/app/outputs/flutter-apk/app-release.apk
