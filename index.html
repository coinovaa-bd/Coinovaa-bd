<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COINOVAA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#070B1A;color:#fff;min-height:100vh;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:26px;font-weight:900;letter-spacing:1px}
.logo span{color:#FFD700}
.btn{background:#FFD700;color:#000;border:0;padding:10px 18px;border-radius:20px;font-weight:800}
.card{background:#131A33;border:1px solid #2A3566;border-radius:18px;padding:18px;margin-top:16px}
.small{color:#9AA3C7;font-size:13px}
.big{font-size:38px;font-weight:900;margin:8px 0}
.big span{color:#FFD700;font-size:20px}
.row{display:flex;gap:12px;margin-top:16px}
.box{flex:1;background:#131A33;border:1px solid #2A3566;border-radius:16px;padding:14px;text-align:center}
.box b{font-size:20px;display:block;margin-top:4px}
.task{background:#1A2345;border-radius:14px;padding:14px;margin-top:12px;display:flex;justify-content:space-between;align-items:center}
.task button{background:#00C853;color:#fff;border:0;padding:8px 14px;border-radius:20px;font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;background:#0D1330;display:flex;justify-content:space-around;padding:14px 0;border-top:1px solid #2A3566}
.nav div{text-align:center;font-size:12px;color:#9AA3C7}
.nav div.active{color:#FFD700}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #2A3566;background:#0D1330;color:#fff;margin-top:10px}
#loginPage{text-align:center;padding-top:40px}
</style>
</head>
<body>
<div id="loginPage">
<div class="logo">COIN<span>OVAA</span></div>
<p class="small" style="margin-top:8px">Earn • Play • Withdraw</p>
<div class="card" style="text-align:left">
<h3>Login / Sign Up</h3>
<input id="name" placeholder="তোমার নাম লিখো">
<input id="phone" placeholder="মোবাইল নাম্বার">
<button class="btn" style="width:100%;margin-top:14px" onclick="login()">LOGIN KORO</button>
</div>
</div>

<div id="app" style="display:none">
<div class="top"><div class="logo">COIN<span>OVAA</span></div><button class="btn" onclick="logout()">Logout</button></div>
<div class="card"><div class="small">👋 Hello, <b id="uname" style="color:#fff"></b></div><div class="small" style="margin-top:10px">Total Balance</div><div class="big"><span id="bal">0</span> <span>Coins</span></div><div class="small">= ৳ <span id="taka">0</span> Taka • 1000 Coins = 100 Tk</div><button class="btn" style="width:100%;margin-top:14px" onclick="withdraw()">WITHDRAW KORO</button></div>
<div class="row"><div class="box"><div class="small">Today Earn</div><b id="today">0</b></div><div class="box"><div class="small">Total Task</div><b id="tasks">0</b></div></div>
<div class="card"><h3>Daily Tasks</h3>
<div class="task"><div><b>🎥 Video Dekho</b><div class="small">+50 Coins</div></div><button onclick="earn(50,this)">Claim</button></div>
<div class="task"><div><b>📢 Ad Dekho</b><div class="small">+30 Coins</div></div><button onclick="earn(30,this)">Claim</button></div>
<div class="task"><div><b>👥 Friend Invite</b><div class="small">+200 Coins</div></div><button onclick="earn(200,this)">Claim</button></div>
<div class="task"><div><b>✅ Daily Check-in</b><div class="small">+20 Coins</div></div><button onclick="earn(20,this)">Claim</button></div>
</div><br><br><br>
</div>
<div class="nav"><div class="active">🏠<br>Home</div><div>🎯<br>Tasks</div><div>👥<br>Refer</div><div>👤<br>Profile</div></div>
<script>
let bal=Number(localStorage.getItem('c_bal')||0);
let today=Number(localStorage.getItem('c_today')||0);
let tc=Number(localStorage.getItem('c_task')||0);
function show(){document.getElementById('bal').innerText=bal;document.getElementById('taka').innerText=(bal/10).toFixed(0);document.getElementById('today').innerText=today;document.getElementById('tasks').innerText=tc;}
function login(){let n=document.getElementById('name').value;if(!n){alert('নাম লিখো!');return;}localStorage.setItem('c_name',n);document.getElementById('loginPage').style.display='none';document.getElementById('app').style.display='block';document.getElementById('uname').innerText=n;show();}
function earn(x,btn){bal+=x;today+=x;tc++;localStorage.setItem('c_bal',bal);localStorage.setItem('c_today',today);localStorage.setItem('c_task',tc);show();btn.innerText='Done ✓';btn.disabled=true;alert('+'+x+' Coins পাইছো!');}
function withdraw(){if(bal<1000){alert('কমপক্ষে 1000 Coins লাগবো! এখন আছে '+bal);}else{alert('Withdraw Request পাঠানো হইছে! ৳'+(bal/10)+' পাবা।');}}
function logout(){document.getElementById('app').style.display='none';document.getElementById('loginPage').style.display='block';}
if(localStorage.getItem('c_name')){document.getElementById('loginPage').style.display='none';document.getElementById('app').style.display='block';document.getElementById('uname').innerText=localStorage.getItem('c_name');show();}
</script>
</body>
</html>
